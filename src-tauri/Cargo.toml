[package]
name = "ddugit"
version = "1.2.0"
description = "ddugit — graph-first Git client"
authors = ["ddugit"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ddugit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Read path only (log, refs, status). Writes go through the git CLI so hooks,
# credentials, signing and LFS behave exactly like the user's own git.
git2 = { version = "0.20", default-features = false }
notify-debouncer-mini = "0.7.0"
# Pull request status from GitHub / GitLab (forge.rs). rustls: no system OpenSSL.
ureq = { version = "3", features = ["json"] }
# Forge tokens the user types in live in the OS keychain (macOS Keychain,
# Windows Credential Manager). Other platforms fall back to an in-memory store.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-opener = "2"
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.3"
# Checksums written next to air-gapped transfer bundles (git/transfer.rs).
sha2 = "0.10"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
