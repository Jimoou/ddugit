name: Store package check

# The Microsoft Store manifest (scripts/msix.mjs) is checked by makeappx, which only
# runs on Windows: pack it around a stand-in executable whenever it changes.
on:
  pull_request:
    paths:
      - scripts/msix.mjs
      - src-tauri/icons/**
      - .github/workflows/msix-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Pack (makeappx)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          layout="$RUNNER_TEMP/msix"
          cp "$(cygpath -u "$WINDIR")/System32/notepad.exe" "$RUNNER_TEMP/ddugit.exe"
          node scripts/msix.mjs "$RUNNER_TEMP/ddugit.exe" "$layout" ddugit.check "CN=ddugit" ddugit
          sdk=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 | sort -V | tail -1)
          "$sdk/makeappx.exe" pack /o /d "$(cygpath -w "$layout")" /p "$(cygpath -w "$RUNNER_TEMP/check.msix")"
