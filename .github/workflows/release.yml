name: Release

# Push a tag like v0.2.0 (or run it manually with "release" checked) to build
# the installers and attach them to a draft GitHub Release: macOS .dmg
# (universal: Apple silicon + Intel) and Windows .exe (NSIS). A manual release
# names itself v<version from tauri.conf.json>; GitHub creates that tag on the
# run's commit when the draft is published. macOS builds are signed and
# notarized once the APPLE_* secrets exist; Windows stays unsigned (SmartScreen
# warns) until WINDOWS_SIGN_COMMAND is set (docs/RELEASE.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a draft release v<version> (otherwise keep the installers as artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS dmg
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows exe
            os: windows-latest
            args: --bundles nsis
            rust-targets: ""
    # A draft release is made from main only (a tag push is already a deliberate release).
    # A manual run without "release" only keeps artifacts, so it may test any branch.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.release)
    runs-on: ${{ matrix.os }}
    env:
      # Code signing turns on by itself once its secrets exist (docs/RELEASE.md).
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_SIGN: ${{ secrets.WINDOWS_SIGN_COMMAND != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # This build's date, and the license issuer's public key (public: an Actions variable).
      - name: Build info
        shell: bash
        env:
          PUBKEY: ${{ vars.DDUGIT_LICENSE_PUBKEY }}
        run: |
          echo "DDUGIT_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "DDUGIT_LICENSE_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"
      - name: macOS signing and notarization
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Check the certificate before the long build, saying which secret is wrong, and
        # repack it in the PKCS#12 flavour macOS `security import` reads (SHA-1 MAC,
        # 3DES): OpenSSL 3's default (AES + SHA-256 MAC) fails there as "MAC
        # verification failed (wrong password?)" even with the right password.
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          # Homebrew's OpenSSL 3 reads both flavours; macOS's own LibreSSL may not read OpenSSL 3's.
          ossl="$(brew --prefix openssl@3 2>/dev/null || true)/bin/openssl"
          [ -x "$ossl" ] || ossl=openssl
          v3=false; "$ossl" version | grep -q '^OpenSSL 3' && v3=true
          echo "$("$ossl" version)"
          if ! printf '%s' "$APPLE_CERTIFICATE" | tr -d ' \r\n' | base64 --decode > "$dir/in.p12" 2>/dev/null || [ ! -s "$dir/in.p12" ]; then
            echo "::error::APPLE_CERTIFICATE is not the base64 of a .p12 file (cut off when pasted?)"; exit 1
          fi
          unpack() { "$ossl" pkcs12 -in "$dir/in.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nodes -out "$dir/all.pem" "$@" 2>"$dir/err"; }
          if ! unpack && ! { $v3 && unpack -legacy; }; then
            echo "::error::The .p12 does not open with APPLE_CERTIFICATE_PASSWORD: the password differs from the one set when exporting, or APPLE_CERTIFICATE is damaged"
            sed 's/^/  /' "$dir/err"; exit 1
          fi
          grep -q 'PRIVATE KEY' "$dir/all.pem" || { echo "::error::The .p12 holds no private key: export the certificate together with its key"; exit 1; }
          cn=$("$ossl" x509 -in "$dir/all.pem" -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= *//p')
          case "$cn" in "Developer ID Application:"*) ;; *) echo "::error::The certificate is \"$cn\", not a Developer ID Application certificate"; exit 1 ;; esac
          if [ "$cn" != "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be exactly the certificate's name: $cn"; exit 1
          fi
          if $v3; then
            "$ossl" pkcs12 -export -in "$dir/all.pem" -passout env:APPLE_CERTIFICATE_PASSWORD -out "$dir/out.p12" \
              -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
          else
            "$ossl" pkcs12 -export -in "$dir/all.pem" -passout env:APPLE_CERTIFICATE_PASSWORD -out "$dir/out.p12"
          fi
          cert=$(base64 < "$dir/out.p12" | tr -d '\n')
          echo "::add-mask::$cert"
          echo "APPLE_CERTIFICATE=$cert" >> "$GITHUB_ENV"
          for v in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
      # The sign command comes from the certificate provider (cloud HSM tools), with %1 for the file.
      - name: Windows signing
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGN == 'true'
        shell: bash
        env:
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          node -e "require('fs').writeFileSync('src-tauri/tauri.sign.json', JSON.stringify({bundle:{windows:{signCommand:process.env.WINDOWS_SIGN_COMMAND}}}))"
          echo "SIGN_ARGS=--config src-tauri/tauri.sign.json" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.release && 'v__VERSION__' || '') }}
          releaseName: ${{ github.ref_type == 'tag' && format('ddugit {0}', github.ref_name) || 'ddugit v__VERSION__' }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            macOS: ddugit_*_universal.dmg · Windows: ddugit_*_x64-setup.exe

            macOS: signed and notarized (Developer ID). Windows: not signed yet, so SmartScreen may warn; choose "More info → Run anyway".
          releaseDraft: true
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }}
      # Gatekeeper's own verdict on what was just built: signed, notarized, ticket stapled.
      - name: Verify macOS signature
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        shell: bash
        run: |
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
      # Other manual runs keep the installers as workflow artifacts instead.
      - if: github.ref_type != 'tag' && !inputs.release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ddugit-${{ matrix.os }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
