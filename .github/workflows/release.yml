name: Release

# Push a tag like v0.2.0 (or run it manually with "release" checked) to build
# the installers and attach them to a draft GitHub Release: macOS .dmg
# (universal: Apple silicon + Intel) and Windows .exe (NSIS). A manual release
# names itself v<version from tauri.conf.json>; GitHub creates that tag on the
# run's commit when the draft is published. Unsigned for now, so first launch
# shows Gatekeeper / SmartScreen warnings; signing is on the roadmap for later.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a draft release v<version> (otherwise keep the installers as artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS dmg
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows exe
            os: windows-latest
            args: --bundles nsis
            rust-targets: ""
    # A draft release is made from main only (a tag push is already a deliberate release).
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.release && 'v__VERSION__' || '') }}
          releaseName: ${{ github.ref_type == 'tag' && format('ddugit {0}', github.ref_name) || 'ddugit v__VERSION__' }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            macOS: ddugit_*_universal.dmg · Windows: ddugit_*_x64-setup.exe

            Unsigned build: on macOS right-click → Open the first time; on Windows choose "More info → Run anyway".
          releaseDraft: true
          args: ${{ matrix.args }}
      # Other manual runs keep the installers as workflow artifacts instead.
      - if: github.ref_type != 'tag' && !inputs.release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ddugit-${{ matrix.os }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
