name: CI · Web

# Pull requests only: main gets the same commit squash-merged, so it isn't
# checked twice. Runs only when the frontend (or its tooling) changes.
on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "*.config.*"
      - "tsconfig*.json"
      - ".prettier*"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI only checks out and builds.
permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck · lint · format · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright · demo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A stalled apt mirror can hang this for hours; fail fast and re-run instead.
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 8
      - run: npm run e2e
        timeout-minutes: 15
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
