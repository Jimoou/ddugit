<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- "ddu" drawn as strokes (no font needed): two d's and a u, in the wordmark's cyan → magenta. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15103a"/>
      <stop offset="1" stop-color="#05040e"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="176" y1="0" x2="848" y2="0">
      <stop offset="0" stop-color="#22e8ff"/>
      <stop offset="0.5" stop-color="#8f7cff"/>
      <stop offset="1" stop-color="#ff3df2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <g fill="none" stroke="url(#ink)" stroke-width="60" stroke-linecap="round" filter="url(#glow)">
    <!-- d -->
    <circle cx="278" cy="600" r="72"/>
    <line x1="350" y1="370" x2="350" y2="672"/>
    <!-- d -->
    <circle cx="512" cy="600" r="72"/>
    <line x1="584" y1="370" x2="584" y2="672"/>
    <!-- u -->
    <path d="M674 528 L674 600 A72 72 0 0 0 818 600 M818 528 L818 672"/>
  </g>
</svg>
